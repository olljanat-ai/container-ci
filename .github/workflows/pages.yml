###############################################################################
# Publish docs/ to GitHub Pages.
#
# The site is three static files plus the generated docs/index.html - there is
# no site build here, only the include substitution that tools/build_docs.py
# already did. This workflow re-runs that renderer in --check mode before it
# publishes anything, so the page served to teams can never be a stale copy of
# a pipeline file it claims to quote.
#
# Enable it once per repository: Settings -> Pages -> Source -> GitHub Actions.
###############################################################################
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/build_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. In-progress runs are allowed to finish rather than
# being cancelled: a cancelled deploy-pages leaves the Pages deployment record
# in a pending state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same check as .github/workflows/checks.yml. Repeated here because this
      # job is what actually publishes: a docs/index.html that drifted from the
      # pipeline files must not be served.
      - name: Check docs/index.html is in sync
        run: python3 tools/build_docs.py --check

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
